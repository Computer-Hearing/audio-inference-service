version: '3.8'

networks:
  inference-net:
    driver: bridge
  computer-hearing:
    external: true

services:
  triton:
    networks:
      - inference-net
    container_name: inference_triton
    build:
      context: ..
      dockerfile: deployments/dockerfiles/Triton.Dockerfile
    expose:
      - "8000" # HTTP endpoints for inference
      - "8001" # GRPS endpoints for inference
      - "8002" # Metrics endpoints for Prometheus
    restart: always
    volumes:
      - triton/models:/models
    command: ["tritonserver", "--model-store=/models"]

  redis:
    networks:
      - inference-net
    container_name: inference_redis
    image: redis:7-alpine
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "noeviction"
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    networks:
      - inference-net
    container_name: inference_backend
    build:
      context: ../backend
      dockerfile: ../deployments/dockerfiles/Backend.Dockerfile
    expose:
      - "6767"
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_ADDR: ${HTTP_ADDR:-:6767}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      TASK_TTL: ${TASK_TTL:-1h}
      TASK_STREAM: ${TASK_STREAM:-tasks}
      TASK_GROUP: ${TASK_GROUP:-inference}
      TASK_ACK_WAIT: ${TASK_ACK_WAIT:-10m}
      TASK_MAX_DELIVERIES: ${TASK_MAX_DELIVERIES:-3}
      TRITON_ADDR: ${TRITON_ADDR:-triton:8001}
    restart: always
    depends_on:
      triton:
        condition: service_started
      redis:
        condition: service_healthy

  caddy:
    networks:
      inference-net:
      computer-hearing:
        aliases:
          - inference_caddy
    container_name: inference_caddy
    build:
      context: ..
      dockerfile: deployments/dockerfiles/Caddy.Dockerfile
    expose:
      - "80"
    #volumes:
    #  - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: always
    depends_on:
      - backend

volumes:
  redis_data:
