version: '3.8'

networks:
  inference-net:
    driver: bridge
  tool-net:
    external: true

services:
  triton:
    networks:
      - inference-net
    image: w0dr/tritonserver:24.09-py3
    container_name: inference_triton
    ports:
      - 8000:8000 # HTTP endpoints for inference
      - 8001:8001 # GRPS endpoints for inference
      - 8002:8002 # Metrics endpoints for Prometheus
    restart: always
    volumes:
      - ../triton/models:/models

    command: >
      bash -c "
        apt-get update && apt-get install -y ffmpeg libsndfile1 && rm -rf /var/lib/apt/lists/* &&
        pip install librosa numpy scipy soundfile torch torchaudio &&
        tritonserver --model-repository=/models
      "

    #command: ["tritonserver", "--model-store=/models"]

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]
              count: 1

  backend:
    networks:
      - inference-net
    container_name: inference_backend
    build:
      context: ../backend
      dockerfile: ../deployments/dockerfiles/Backend.Dockerfile
    ports:
      - 6767:6767
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ${HTTP_ADDR:-:6767}
      DB_PATH: ${DB_PATH:-sqlite.db}
      TRITON_ADDR: ${TRITON_ADDR:-triton:8001}
    volumes:
      - backend_data:/app
    restart: always
    depends_on:
      - triton

  caddy:
    networks:
      - inference-net
      - tool-net
    container_name: inference_caddy
    build:
      context: ..
      dockerfile: deployments/dockerfiles/Caddy.Dockerfile
    ports:
      - 80:80
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: always
    depends_on:
      - backend

volumes:
  backend_data:
